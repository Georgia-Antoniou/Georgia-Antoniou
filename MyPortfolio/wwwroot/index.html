    <style>
        /* Loading screen styles */
        /* #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }*/

        .spinner {
            width: 56px;
            height: 56px;
            border: 8px solid #e0e0e0;
            border-top: 8px solid #3f51b5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-progress-text {
            font-family: inherit;
            font-size: 1.3rem;
            color: #3f51b5;
            margin-top: 6px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <section id="app" role="status" aria-live="polite">
        <div class="spinner"></div>
        <div class="loading-progress-text">
            Loading application&hellip;
        </div>
    </section>
